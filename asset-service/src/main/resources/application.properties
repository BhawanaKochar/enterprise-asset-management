spring.application.name=asset-service

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/asset_management?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
spring.datasource.username=eam_app
spring.datasource.password=Password123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

